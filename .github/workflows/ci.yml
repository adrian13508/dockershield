name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal pkg test)"
      - run: go vet -tags integration ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --build-tags integration
      - run: shellcheck install.sh metrics.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o skobel ./cmd/skobel
      - name: Scan deliberately misconfigured containers
        run: SKOBEL_BIN=$PWD/skobel go test -v -tags integration ./test/
