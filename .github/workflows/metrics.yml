name: Metrics

# Appends one row a day to metrics.csv on the `metrics` branch.
# Needs the repository secret METRICS_TOKEN: a fine-grained personal access
# token for this repository with "Administration: read-only". The default
# GITHUB_TOKEN cannot read the traffic endpoints.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the metrics branch next to the code
        run: |
          if git fetch origin metrics; then
            git worktree add data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan metrics
            git -C data rm -rfq .
          fi
      - name: Append today's row
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          METRICS_REPO: ${{ github.repository }}
        run: ./metrics.sh data/metrics.csv
      - name: Push
        run: |
          cd data
          git add metrics.csv
          git diff --cached --quiet && exit 0   # today's row was already there
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "metrics: $(date -u +%Y-%m-%d)"
          git push origin HEAD:metrics
