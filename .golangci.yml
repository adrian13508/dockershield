version: "2"
linters:
  settings:
    errcheck:
      # Close/Remove on read-only handles and best-effort cleanup
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - (*github.com/adrian13508/skobel/internal/docker.Client).Close
    staticcheck:
      # golangci defaults, minus QF1003 (if/else chain -> switch is a style preference)
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1003"]
