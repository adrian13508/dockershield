# The same services as compose.yml with the fixes the scanner suggests applied.
name: skobel-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: not-a-real-secret
    ports:
      - "127.0.0.1:5432:5432"

  cache:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  web:
    image: nginx:alpine
    ports:
      - "8080:80" # meant to be public

  admin:
    image: nginx:alpine
    command: ["sh", "-c", "sed -i 's/listen  *80;/listen 9000;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    ports:
      - "127.0.0.1:9000:9000"

  hostnet:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80" # bridge network instead of network_mode: host

  watcher:
    image: alpine:3
    command: ["sleep", "infinity"] # socket mount removed
